[package]
name = "mistake-agent"
version = "0.1.0"
edition = "2024"
description = "Mistake Agent v2：面向中学生的本地错题管理 + 辅助学习 Agent"

[lib]
name = "mistake_agent"
path = "src/lib.rs"

[[bin]]
name = "mistake-agent"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dunce = "1.0.5"
flexi_logger = "0.31.9"
futures-core = "0.3.33"
futures-util = "0.3.33"
jsonschema = "0.49.3"
log = "0.4.33"
pdf-extract = "0.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rfd = "0.17.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = "2"
