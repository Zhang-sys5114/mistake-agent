[package]
name = "so-lite-agent"
version = "0.1.0"
edition = "2024"
description = "通用轻量 Agent 运行时：agent loop / 工具注册 / 会话 / 模型 Provider 抽象 / 通用 RPC，cargo add 即用"

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
jsonschema = "0.49.3"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
