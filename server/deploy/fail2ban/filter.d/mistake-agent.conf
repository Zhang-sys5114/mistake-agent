# fail2ban —— filter 定义
#
# 匹配服务端输出的**固定格式安全日志行**（见 server/src/auth/handlers.rs::record_login_failure）：
#
#   AUTH_FAIL ip=203.0.113.9 email=a@b.test reason=bad_password
#   AUTH_BLOCK ip=203.0.113.9 email=a@b.test block_secs=900
#
# 两层防护的分工（不要只留一层）：
#   - 服务端进程内的失败封禁（见 server/src/security/lockout.rs）：立刻生效、按 IP **与账号**
#     双维度计数，默认 5 次失败 / 10 分钟窗口 → 封 15 分钟。换进程就重置。
#   - 本 fail2ban jail：跨重启持久、按 IP 封、时间窗更长，且能在服务端被打挂时仍然生效。
#
# ⚠️ 前提：只有服务端配置了 SECURITY_TRUST_PROXY=true（确认自己确实在反向代理后面）时，
# `ip=` 字段才是真实客户端 IP。若为 false，该字段是 TCP 对端地址（本机部署时恒为 127.0.0.1），
# 此时**不要**启用按 IP 的封禁——会把自己的反代一起封掉。
#
# 安装：复制到 /etc/fail2ban/filter.d/mistake-agent.conf

[Definition]

failregex = ^.*AUTH_FAIL ip=<HOST> .*$
            ^.*AUTH_BLOCK ip=<HOST> .*$

ignoreregex =
