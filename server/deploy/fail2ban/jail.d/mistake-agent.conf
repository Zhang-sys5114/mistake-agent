# fail2ban —— jail 定义
#
# 安装：复制到 /etc/fail2ban/jail.d/mistake-agent.conf，然后 `fail2ban-client reload`。
# 依赖 filter.d/mistake-agent.conf（同一目录树里）。
#
# logpath 依部署方式而定：systemd + journald 时改用 backend = systemd；
# 直接写文件时用下面的路径（S8 运维手册会定稿）。

[mistake-agent]
enabled   = true
filter    = mistake-agent
logpath   = /var/log/mistake-agent/server.log
backend   = auto

# 与进程内封禁（5 次 / 10 分钟）相比更宽松、但持久：
# 进程内那层负责"当场止血"，这层负责"这个人下次开机还是进不来"
maxretry  = 10
findtime  = 1h
bantime   = 24h

# 只封具体 IP（不要 ban 整个网段：学校/家庭常在共享 NAT 后面，误伤一整栋楼）
banaction = iptables-multiport
action    = %(banaction)s[name=%(__name__)s, port="http,https", protocol=tcp]
